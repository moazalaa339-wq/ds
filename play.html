<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hawa Game</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta name="description" content="Hawa Engine — محرك ألعاب مصري لبناء وتشغيل ألعاب 3D أونلاين وأوفلاين بسهولة.">
<meta property="og:title" content="Hawa Engine">
<meta property="og:description" content="محرك ألعاب مصري — بناء وتشغيل ألعاب ثلاثية الأبعاد مع دعم الأونلاين.">
<meta property="og:image" content="favicon.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Hawa Engine">
<meta name="twitter:description" content="محرك ألعاب مصري لبناء وتشغيل ألعاب 3D.">

<link rel="stylesheet" href="style.css">
<style>
#playHome{position:fixed;top:14px;inset-inline-end:14px;z-index:9998;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;text-decoration:none;
  font:800 13px Cairo,Tahoma,sans-serif;color:#ffe2a6;border-radius:5px 999px 5px 999px;border:1px solid rgba(255,190,61,.6);
  background:linear-gradient(180deg,rgba(255,190,61,.26),rgba(10,8,15,.88));backdrop-filter:blur(6px);box-shadow:0 10px 28px rgba(0,0,0,.5);transition:box-shadow .15s,color .15s}
#playHome span{font-size:18px;line-height:1;color:#ffbe3d}
#playHome:hover{box-shadow:0 0 0 1px #ffbe3d,0 0 22px rgba(255,190,61,.35);color:#fff}
</style>
<script src="hawa-fx.js"></script>
</head>
<body>
<a id="playHome" class="hawa-icon-btn" href="index.html" title="الرئيسية"><span class="hawa-ico-frame" data-ic="home"></span><i>الرئيسية</i></a>

<!-- ================= طبقة البناء (Build) ================= -->
<div id="app">
  <header id="bar">
    <div class="brand"><span class="logo"><img src="logo.png" alt="Hawa"></span><div><b>Hawa</b> Engine<small>v2.3 · بناء</small></div></div>

    <nav class="tabs" id="secs">
      <button data-sec="objects" class="on"><span data-ic="objects"></span>الكائنات</button>
      <button data-sec="prog"><span data-ic="prog"></span>البرمجة</button>
      <button data-sec="sobj"><span data-ic="sobj"></span>الكائنات البرمجية</button>
    </nav>

    <div class="grow"></div>

    <div class="seg">
      <button id="bAuto" title="تلقائي"><span data-ic="code"></span><i>تلقائي</i></button>
      <button id="bSave" title="حفظ"><span data-ic="save"></span><i>حفظ</i></button>
      <button id="bLoad" title="تحميل"><span data-ic="load"></span><i>تحميل</i></button>
    </div>
    <div class="seg">
      <button id="bConvert" title="تحويل إلى لعبة"><span data-ic="export"></span><i>تحويل إلى لعبة</i></button>
      <button id="bOpenGame" title="فتح اللعبة"><span data-ic="play"></span><i>فتح اللعبة</i></button>
    </div>
    <button id="bTest" class="go" title="اختبر"><span data-ic="play"></span>اختبر</button>
  </header>

  <!-- شريط الأدوات الجانبي -->
  <nav id="rail">
    <div class="rail-group" id="tools">
      <button data-tool="select" class="on" title="تحديد"><span data-ic="cursor"></span></button>
      <button data-tool="place" title="وضع"><span data-ic="plus"></span></button>
      <button data-tool="delete" title="حذف"><span data-ic="trash"></span></button>
    </div>
    <div class="rail-group">
      <button id="bFly" title="طيران"><span data-ic="fly"></span></button>
      <button id="bRs" title="نقطة أوفلاين"><span data-ic="flag"></span></button>
      <button id="bOnRs" title="نقطة أونلاين"><span data-ic="users"></span><span class="snap-l" id="onRsN">0/8</span></button>
      <button id="bSnap" title="شبكة"><span data-ic="grid"></span><span class="snap-l">0.5</span></button>
    </div>
    <div class="rail-group bottom">
      <button id="bPar" class="on" title="لوحات"><span data-ic="panel"></span></button>
    </div>
  </nav>

  <!-- لوحة الأقسام اليسرى -->
  <aside id="dock">
    <div class="dock-head"><span id="dockTitle">الكائنات</span></div>

    <div id="catP">
      <div class="search"><span data-ic="search"></span><input id="q" placeholder="ابحث عن كائن"></div>
      <div id="grid"></div>
    </div>

    <div id="progP" hidden>
      <div class="sub"><span>ملفات البرمجة</span><span id="pCount" class="mut">0</span></div>
      <div class="row">
        <button id="pNew" class="pri">＋ ملف جديد</button>
        <button id="pUp">⬆ رفع</button>
        <button id="pAuto" title="ملف تلقائي">⬇</button>
      </div>
      <div id="pList"></div>
    </div>

    <div id="sobjP" hidden>
      <div class="sub"><span>كائنات برمجية</span><span id="sCount" class="mut">0</span></div>
      <div class="row">
        <button id="sNew" class="pri">＋ كائن جديد</button>
        <button id="sUp">⬆ رفع</button>
        <button id="sAuto" title="ملف تلقائي">⬇</button>
      </div>
      <div id="sList"></div>
    </div>
  </aside>

  <!-- منطقة العرض -->
  <main id="vp">
    <canvas id="cv"></canvas>

    <div id="modeChip" class="chip-top">🏗 بناء</div>

    <div id="gz" hidden>
      <div class="gz-row">
        <div class="gseg">
          <button data-g="move" class="on" title="نقل (W)"><span class="ico" data-ic="move"></span><i>نقل</i></button>
          <button data-g="rotate" title="تدوير (E)"><span class="ico" data-ic="rotate"></span><i>تدوير</i></button>
          <button data-g="scale" title="حجم (R)"><span class="ico" data-ic="scale"></span><i>حجم</i></button>
        </div>
        <div class="gseg">
          <button id="gUp" data-a="up" title="طلوع: يرفعه خطوة الشبكة"><span class="ico" data-ic="up"></span><i>طلوع</i></button>
          <button id="gDown" data-a="down" title="نزول: يهبط لحد أول سطح تحته"><span class="ico" data-ic="down"></span><i>نزول</i></button>
          <button id="gFly" data-a="fly" title="طيران: 3 وحدات فوق السطح"><span class="ico" data-ic="fly"></span><i>طيران</i></button>
          <button id="gVis" data-a="vis" title="إظهار/إخفاء في الاختبار (H)"><span class="ico" data-ic="eye"></span><i id="gVisT">إخفاء</i></button>
        </div>
        <div class="gseg">
          <button id="gDup" title="نسخ (Ctrl+D)"><span class="ico" data-ic="copy"></span><i>نسخ</i></button>
          <button id="gDel" class="red" title="حذف (Del)"><span class="ico" data-ic="trash"></span><i>حذف</i></button>
          <button id="gCoord" title="إحداثيات"><span class="ico" data-ic="grid"></span><i>إحداثيات</i></button>
        </div>
      </div>
      <div id="gzHint" class="gz-hint"></div>
    </div>

    <div id="coordPanel" class="coord-panel" hidden>
      <div class="cp-row"><b>X</b><span id="cx">0.000</span></div>
      <div class="cp-row"><b>Y</b><span id="cy">0.000</span></div>
      <div class="cp-row"><b>Z</b><span id="cz">0.000</span></div>
      <div class="cp-row mut" id="cName">—</div>
    </div>
    <div id="crosshair" hidden>+</div>

    <div id="stat"></div>
    <div id="tip"></div>
  </main>

  <!-- لوحة المشهد والخصائص اليمين -->
  <aside id="side">
    <div class="sub"><span>المشهد</span><span id="objCount" class="mut">0 كائن</span></div>
    <div class="search"><span data-ic="search"></span><input id="hq" placeholder="ابحث في المشهد"></div>
    <div id="hier"></div>
    <div class="sub"><span>الخصائص</span></div>
    <div id="ins"></div>
  </aside>
</div>

<!-- ================= طبقة الاختبار (منفصلة تماماً) ================= -->
<div id="play" hidden>
  <div id="pvp"></div>
  <div id="pTop">
    <button id="pExit" class="stop"><span data-ic="stop"></span>خروج للبناء<kbd>P</kbd></button>
  </div>
  <div id="pOnlineBar">
    <button type="button" id="pMenuBtn" title="قائمة الأونلاين"><img src="logo-64.png" alt="Hawa"></button>
    <button type="button" id="pMic" class="online-compact" title="المايك">
      <span class="mic-ico" aria-hidden="true">
        <svg class="r" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/><line x1="4" y1="4" x2="20" y2="20"/></svg>
        <svg class="g" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </span>
      <span class="mic-lbl">مكتوم</span>
      <span class="mic-bar"><i></i></span>
    </button>
  </div>
  <div id="pHud">
    <div class="chip msg" id="pMsg" hidden></div>
  </div>
  <div id="pPrompt" class="prompt" hidden></div>
  <div id="pFps"></div>
  <div id="pHelp" hidden></div>
</div>
<div id="pOnlineMenu" aria-hidden="true">
  <div class="pom-card" role="dialog">
    <div class="pom-head">
      <div class="pom-logo"><img src="logo.png" alt="Hawa"></div>
      <div>
        <div class="pom-title">Hawa Online</div>
        <div class="pom-sub">إعدادات الجلسة</div>
      </div>
      <button type="button" class="pom-close" id="pMenuClose" title="إغلاق">✕</button>
    </div>
    <div class="pom-list">
      <button type="button" class="pom-item" id="pMuteAll">
        <span class="hawa-ico-frame" data-ic="mute"></span>
        <span id="pMuteAllLbl">كتم أصوات جميع اللاعبين</span>
      </button>
      <button type="button" class="pom-item danger" id="pLeaveOnline">
        <span class="hawa-ico-frame" data-ic="leave"></span>
        <span>الخروج من الأونلاين والرجوع للرئيسية</span>
      </button>
    </div>
    <div class="pom-hint">المايك من الأيقونة أعلى اليسار</div>
  </div>
</div>
<div id="pOnlineConfirm" aria-hidden="true">
  <div class="poc-card">
    <h3>تأكيد الخروج</h3>
    <p>هتخرج من الرووم ويتقطع الاتصال، واللاعبين هيشوفوا إنك غادرت. متأكد؟</p>
    <div class="poc-row">
      <button type="button" class="poc-cancel" id="pLeaveCancel">إلغاء</button>
      <button type="button" class="poc-ok" id="pLeaveOk">تأكيد الخروج</button>
    </div>
  </div>
</div>

<!-- ================= محرر الملفات ================= -->
<div id="ed" hidden>
  <div class="box">
    <div class="eh">
      <span id="edKind" class="tag">ملف برمجة</span>
      <input id="edName" placeholder="اسم الملف">
      <span class="grow"></span>
      <button id="edS" class="pri"><span data-ic="save"></span>حفظ</button>
      <button id="edD" class="red" title="حذف"><span data-ic="trash"></span></button>
      <button id="edX" title="إغلاق">✕</button>
    </div>
    <textarea id="edT" spellcheck="false"></textarea>
  </div>
</div>
<input type="file" id="fl" accept=".json,.js,.txt" multiple hidden>

<script>window.HAWA_PLAY_ONLY = true;</script>
<script src="game-data.js"></script>
<script src="three.min.js"></script>
<script src="peerjs.min.js"></script>
<script src="engine.js"></script>
</body>
</html>
