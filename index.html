<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06050a">
<title>Hawa Engine · محرك هوا</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">

<meta property="og:title" content="Hawa Engine">
<meta property="og:description" content="محرك ألعاب مصري — بناء وتشغيل ألعاب ثلاثية الأبعاد مع دعم الأونلاين.">

<style>
:root{
  --bg:#06050a;--pan:#0e0c14;--tx:#f4efe4;--mu:#a199ae;
  --tq:#2de2c4;--tq2:#14b8a0;--au:#ffbe3d;--au2:#ff9d1c;
  --line:rgba(255,214,150,.12);--line2:rgba(255,214,150,.26);
  --leaf:26px 4px 26px 4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font:14px/1.5 Cairo,Tahoma,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
a{color:inherit;text-decoration:none}

/* ---------- الخلفية ---------- */
.bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(1100px 620px at 14% -10%,rgba(255,190,61,.13),transparent 62%),
    radial-gradient(1100px 640px at 106% 112%,rgba(45,226,196,.13),transparent 62%),
    repeating-linear-gradient(45deg,rgba(255,214,150,.026) 0 1px,transparent 1px 18px),
    var(--bg)}
#fx{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;opacity:.92}
.eye{position:fixed;z-index:1;inset-inline:0;top:50%;transform:translateY(-50%);text-align:center;font-size:min(64vw,620px);line-height:1;
  color:rgba(255,190,61,.03);pointer-events:none;filter:blur(2px)}
.ring,.ring.r2{display:none}
@keyframes spin{to{rotate:360deg}}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.72) 100%)}

/* ---------- الصفحة ---------- */
.page{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4.5vh,48px);
  padding:max(20px,env(safe-area-inset-top)) 24px max(20px,env(safe-area-inset-bottom))}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.mark{width:76px;height:76px;position:relative;display:grid;place-items:center;margin-bottom:6px}
.mark::before{content:"";position:absolute;inset:8px;transform:rotate(45deg);border-radius:12px;
  background:linear-gradient(145deg,var(--au),var(--au2));box-shadow:0 0 44px rgba(255,190,61,.6),inset 0 1px 0 rgba(255,255,255,.5);animation:pulse 3.4s ease-in-out infinite}
.mark::after{content:"";position:absolute;inset:0;transform:rotate(45deg);border-radius:16px;border:1px solid rgba(255,190,61,.45)}
.mark em{position:relative;z-index:1;font-style:normal;font-size:34px;color:#1a1206;line-height:1}
@keyframes pulse{50%{box-shadow:0 0 70px rgba(255,190,61,.85),inset 0 1px 0 rgba(255,255,255,.5)}}
h1{direction:ltr;font:900 clamp(38px,7.4vw,84px)/1 Cairo,Tahoma,sans-serif;letter-spacing:.2em;padding-inline-start:.2em;
  background:linear-gradient(180deg,#fff 10%,#ffe2a6 55%,var(--au) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(255,190,61,.35))}
.sub{direction:ltr;font:700 clamp(11px,1.5vw,15px)/1 Cairo,Tahoma,sans-serif;letter-spacing:.9em;padding-inline-start:.9em;color:var(--tq)}
.pick{margin-top:clamp(8px,2vh,22px);display:flex;align-items:center;gap:14px;font-weight:800;font-size:clamp(14px,1.8vw,18px);color:#e6dcc9;letter-spacing:.5px}
.pick::before,.pick::after{content:"";width:clamp(30px,8vw,90px);height:1px;background:linear-gradient(90deg,transparent,var(--au))}
.pick::after{background:linear-gradient(90deg,var(--au),transparent)}

/* ---------- البطاقات ---------- */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,3vw,36px);width:min(1020px,100%);perspective:1400px}
.card{
  --c:var(--tq);--c2:var(--tq2);--cr:45,226,196;--mx:50%;--my:50%;
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.2vh,22px);
  min-height:clamp(250px,42vh,400px);padding:30px 22px;border-radius:var(--leaf);overflow:hidden;cursor:pointer;
  background:
    radial-gradient(420px 300px at var(--mx) var(--my),rgba(var(--cr),.20),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%),
    rgba(14,12,20,.88);
  border:1px solid rgba(var(--cr),.38);
  box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.02);
  transform-style:preserve-3d;transition:transform .25s ease,border-color .2s,box-shadow .25s;
  animation:rise .9s cubic-bezier(.16,1,.3,1) both;outline:0}
.card.build{--c:var(--au);--c2:var(--au2);--cr:255,190,61;animation-delay:.12s}
.card.play{animation-delay:.24s}
.card::before,.card::after{content:"";position:absolute;width:30px;height:30px;pointer-events:none;border:0}
.card::before{left:0;top:0;border-top:3px solid var(--c);border-left:3px solid var(--c);border-top-left-radius:4px}
.card::after{right:0;bottom:0;border-bottom:3px solid var(--c);border-right:3px solid var(--c);border-bottom-right-radius:4px}
.card:hover,.card:focus-visible{border-color:var(--c);box-shadow:0 36px 80px rgba(0,0,0,.65),0 0 0 1px var(--c),0 0 60px -6px rgba(var(--cr),.55)}
.card:active{transform:scale(.985)!important}
.num{position:absolute;top:14px;inset-inline-end:20px;font:900 52px/1 Consolas,monospace;direction:ltr;color:transparent;-webkit-text-stroke:1px rgba(var(--cr),.35)}
.ico{position:relative;width:clamp(84px,11vw,118px);aspect-ratio:1;display:grid;place-items:center;transform:translateZ(50px)}
.ico::before{content:"";position:absolute;inset:11%;transform:rotate(45deg);border-radius:18%;
  background:linear-gradient(145deg,var(--c),var(--c2));box-shadow:0 0 50px rgba(var(--cr),.6),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .4s cubic-bezier(.16,1,.3,1)}
.ico::after{content:"";position:absolute;inset:0;transform:rotate(45deg);border-radius:22%;border:1px solid rgba(var(--cr),.5);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.card:hover .ico::before{transform:rotate(135deg)}
.card:hover .ico::after{transform:rotate(225deg) scale(1.08)}
.ico svg{position:relative;z-index:1;width:46%;height:46%;fill:#04201a;stroke:none}
.card.build .ico svg{fill:none;stroke:#1d1204;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.name{transform:translateZ(36px);font:900 clamp(26px,3.4vw,40px)/1.1 Cairo,Tahoma,sans-serif;letter-spacing:.5px}
.tag{transform:translateZ(26px);direction:ltr;font:800 12px/1 Cairo,Tahoma,sans-serif;letter-spacing:.55em;padding-inline-start:.55em;color:var(--c)}
.go{transform:translateZ(30px);margin-top:4px;display:inline-flex;align-items:center;gap:10px;padding:11px 26px;border-radius:999px 5px 999px 5px;
  font-weight:900;font-size:14px;color:#07120f;background:linear-gradient(135deg,var(--c),var(--c2));
  box-shadow:0 10px 28px -6px rgba(var(--cr),.7),inset 0 1px 0 rgba(255,255,255,.5);transition:gap .2s,filter .2s}
.go b{font-size:18px;line-height:1;transition:transform .2s}
.card:hover .go{gap:16px;filter:brightness(1.1)}
.card:hover .go b{transform:translateX(-4px)}

.foot{position:fixed;z-index:3;bottom:max(14px,env(safe-area-inset-bottom));inset-inline:0;text-align:center;direction:ltr;
  font:700 11px/1 Consolas,monospace;letter-spacing:.35em;color:rgba(255,226,166,.42)}
.keys{position:fixed;z-index:3;top:max(16px,env(safe-area-inset-top));inset-inline-start:20px;display:flex;gap:8px;direction:ltr}
kbd{font:700 11px/1 Consolas,monospace;padding:5px 9px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;background:rgba(10,8,15,.7);color:var(--mu)}

@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.flash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle,#fff,var(--c0,#2de2c4) 60%,#000);opacity:0;pointer-events:none;transition:opacity .38s ease}
.flash.on{opacity:1}

@media (max-width:760px){
  html,body{overflow:auto}
  .page{justify-content:flex-start;gap:24px;padding-top:max(36px,env(safe-area-inset-top));padding-bottom:70px;min-height:100%}
  .modes{grid-template-columns:1fr}
  .card{min-height:230px;flex-direction:column}
  .keys{display:none}
}
@media (hover:none){.card{transform:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- أنيميشن دخول المحرك — عظيم وهادئ ---------- */
#gate{position:fixed;inset:0;z-index:50;direction:ltr;overflow:hidden;background:#020206;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
#gate.open{background:transparent;pointer-events:none}
#gate.done{display:none!important}
#gate .door{position:absolute;left:0;right:0;height:50%;overflow:hidden;z-index:1;will-change:transform;
  transition:transform .85s cubic-bezier(.66,0,.2,1);
  background:
    repeating-linear-gradient(90deg,transparent 0 119px,rgba(255,255,255,.028) 119px 120px),
    repeating-linear-gradient(0deg,transparent 0 59px,rgba(255,255,255,.02) 59px 60px),
    linear-gradient(180deg,#0b0a14,#171322)}
#gate .door.top{top:0;transform:translateY(-101%)}
#gate .door.bot{bottom:0;transform:translateY(101%);
  background:
    repeating-linear-gradient(90deg,transparent 0 119px,rgba(255,255,255,.028) 119px 120px),
    repeating-linear-gradient(0deg,transparent 0 59px,rgba(255,255,255,.02) 59px 60px),
    linear-gradient(0deg,#0b0a14,#171322)}
#gate .door::after{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.16)}
#gate .door.top::after{bottom:0}
#gate .door.bot::after{top:0}
#gate.close .door{transform:none}
#gate.open .door{transition:transform 1.15s cubic-bezier(.76,0,.18,1)}
#gate.open .door.top{transform:translateY(-101%)}
#gate.open .door.bot{transform:translateY(101%)}

#gate .stage{position:absolute;left:0;width:100%;height:200%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:"Segoe UI",Cairo,Tahoma,sans-serif;user-select:none}
#gate .door.top .stage{top:0}
#gate .door.bot .stage{bottom:0}
#gate .eye{font-size:clamp(22px,5vw,34px);color:rgba(220,212,196,.6);margin-bottom:clamp(10px,2vh,18px);opacity:0;transform:translateY(-10px);
  transition:opacity .9s ease,transform .9s ease}
#gate.logo .eye{opacity:1;transform:none}
#gate .eye .gate-logo{width:clamp(52px,11vw,96px);height:clamp(52px,11vw,96px);object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 20px rgba(255,190,61,.6)) drop-shadow(0 0 40px rgba(255,190,61,.25));display:block;margin:0 auto}
.bg-logo{width:min(42vw,280px);height:auto;opacity:.14;filter:blur(1.5px);border-radius:50%;display:inline-block}
.mark-logo{width:80px;height:80px;object-fit:contain;position:relative;z-index:2;border-radius:50%;filter:drop-shadow(0 0 18px rgba(255,190,61,.55)) drop-shadow(0 4px 12px rgba(0,0,0,.35));display:block}
.mark em{display:none}
.mark{background:none!important}
.mark::before,.mark::after{display:none!important}
#gate .big{display:flex;font-weight:700;font-size:clamp(54px,17vw,132px);line-height:1;letter-spacing:.14em;padding-inline-start:.14em;color:#f4f0e8}
#gate .small{display:flex;font-weight:500;font-size:clamp(14px,4.4vw,28px);line-height:1;color:rgba(45,226,196,.92);
  margin-top:clamp(12px,2.4vh,22px);letter-spacing:1.1em;padding-inline-start:1.1em;transition:letter-spacing 1.5s cubic-bezier(.16,1,.3,1),padding .9s}
#gate.logo .small{letter-spacing:.62em;padding-inline-start:.62em}
#gate .ch{display:inline-block;opacity:0;transform:translateY(38px) scale(1.18);filter:blur(10px);transition:text-shadow .55s ease}
#gate.logo .ch{animation:gChIn .95s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d,0ms)}
#gate.charge .big .ch{text-shadow:0 0 22px rgba(45,226,196,.65),0 0 64px rgba(45,226,196,.3)}
#gate.charge .small .ch{text-shadow:0 0 16px rgba(255,190,61,.7)}
@keyframes gChIn{0%{opacity:0;transform:translateY(38px) scale(1.18);filter:blur(10px)}60%{filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}

#gate #seam,#gate #prog{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,#2de2c4 18%,#fff 50%,#ffbe3d 82%,transparent)}
#gate #seam{z-index:4;opacity:0;transform:scaleX(.02);box-shadow:0 0 16px 3px rgba(45,226,196,.6),0 0 46px 8px rgba(255,190,61,.28)}
#gate.impact #seam{animation:gSeam .85s ease-out forwards}
@keyframes gSeam{0%{opacity:1;transform:scaleX(.02) scaleY(3)}35%{opacity:1;transform:scaleX(1) scaleY(4)}100%{opacity:0;transform:scaleX(1) scaleY(1)}}
#gate #prog{z-index:4;opacity:0;transform:scaleX(0);box-shadow:0 0 10px 1px rgba(45,226,196,.45)}
#gate.logo #prog{opacity:.9;transform:scaleX(1);transition:transform 2s cubic-bezier(.4,0,.2,1),opacity .4s}
#gate.charge #prog{box-shadow:0 0 18px 4px rgba(45,226,196,.8),0 0 50px 10px rgba(255,190,61,.35);transition:box-shadow .4s}
#gate.open #prog{opacity:0;transition:opacity .3s}
#gate #burst{position:absolute;left:0;right:0;top:50%;height:300px;margin-top:-150px;z-index:4;pointer-events:none;opacity:0;transform:scaleY(.05);
  background:radial-gradient(ellipse at center,rgba(255,255,255,.55),rgba(45,226,196,.25) 30%,transparent 70%)}
#gate.impact #burst{animation:gBurst .9s ease-out forwards}
@keyframes gBurst{0%{opacity:1;transform:scaleY(.05)}100%{opacity:0;transform:scaleY(1)}}
#gate #beam{position:absolute;inset:0;z-index:0;opacity:0;pointer-events:none;
  background:radial-gradient(ellipse 100% 42% at 50% 50%,rgba(225,255,249,.95),rgba(45,226,196,.38) 45%,transparent 78%)}
#gate.open #beam{animation:gBeam 1.2s ease-out forwards}
@keyframes gBeam{0%{opacity:1}100%{opacity:0}}
.page.boot-hide{opacity:0;transform:translateY(16px) scale(1.035);pointer-events:none}
.page.boot-show{
  opacity:1;transform:none;
  transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.4s cubic-bezier(.22,1,.36,1)}
.modes.boot-pop .card{animation:none;opacity:0;transform:translateY(14px)}
.modes.boot-pop.reveal .card{
  opacity:1;transform:none;
  transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1)}
.modes.boot-pop.reveal .card.play{transition-delay:.18s}
.modes.boot-pop.reveal .card.build{transition-delay:.38s}

</style>
<script src="three.min.js"></script>
<script src="player-preview.js"></script>
<script src="hawa-fx.js"></script>
</head>
<body>

<div id="gate" aria-hidden="true">
  <div id="beam"></div>
  <div class="door top"><div class="stage"><div class="eye"><img src="logo-256.png" alt="Hawa" class="gate-logo"></div><div class="big"><span class="ch" style="--d:0ms">H</span><span class="ch" style="--d:90ms">A</span><span class="ch" style="--d:180ms">W</span><span class="ch" style="--d:270ms">A</span></div><div class="small"><span class="ch" style="--d:420ms">E</span><span class="ch" style="--d:485ms">N</span><span class="ch" style="--d:550ms">G</span><span class="ch" style="--d:615ms">I</span><span class="ch" style="--d:680ms">N</span><span class="ch" style="--d:745ms">E</span></div></div></div>
  <div class="door bot"><div class="stage"><div class="eye"><img src="logo-256.png" alt="Hawa" class="gate-logo"></div><div class="big"><span class="ch" style="--d:0ms">H</span><span class="ch" style="--d:90ms">A</span><span class="ch" style="--d:180ms">W</span><span class="ch" style="--d:270ms">A</span></div><div class="small"><span class="ch" style="--d:420ms">E</span><span class="ch" style="--d:485ms">N</span><span class="ch" style="--d:550ms">G</span><span class="ch" style="--d:615ms">I</span><span class="ch" style="--d:680ms">N</span><span class="ch" style="--d:745ms">E</span></div></div></div>
  <div id="burst"></div><div id="seam"></div><div id="prog"></div>
</div>

<div class="bg"></div>
<div class="eye"><img src="logo-256.png" alt="" class="bg-logo"></div>
<div class="ring"></div><div class="ring r2"></div>
<canvas id="fx"></canvas>
<div class="vig"></div>

<div class="keys"><kbd>1</kbd><kbd>2</kbd><kbd>Enter</kbd></div>

<main class="page boot-hide" id="mainPage">
  <header class="hero">
    <div class="mark"><img src="logo.png" alt="Hawa Engine" class="mark-logo"></div>
    <h1>HAWA</h1>
    <div class="sub">ENGINE</div>
    <div class="pick">اختر الوضع</div>
  </header>

  <section class="modes boot-pop" id="modeCards">
    <a class="card play" href="game.html" data-c="#2de2c4" tabindex="0">
      <span class="num">01</span>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></div>
      <div class="name">وضع اللعب</div>
      <div class="tag">PLAY</div>
      <span class="go">ابدأ <b>←</b></span>
    </a>
    <a class="card build" href="build.html" data-c="#ffbe3d" tabindex="0">
      <span class="num">02</span>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <div class="name">وضع البناء</div>
      <div class="tag">BUILD</div>
      <span class="go">ابدأ <b>←</b></span>
    </a>
  </section>
</main>

<div class="foot">HAWA ENGINE · V2.20</div>
<div class="flash" id="flash"></div>

<script>
(function(){
  /* خلفية: شخصية حقيقية — كرافتة يمين/يسار · كاميرا سينمائية · لون بدلة متدرّج */
  (function () {
    var host = document.getElementById('fx');
    if (!host || !window.THREE || !window.HawaPlayerPreview) return;
    var T = window.THREE;
    var reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;

    var renderer = new T.WebGLRenderer({ canvas: host, antialias: true, alpha: true, powerPreference: 'low-power' });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    try { if (renderer.outputColorSpace != null) renderer.outputColorSpace = T.SRGBColorSpace; } catch (_) {}

    var scene = new T.Scene();
    var camera = new T.PerspectiveCamera(30, 1, 0.05, 50);
    camera.position.set(0, 1.35, 5.2);
    camera.lookAt(0, 1.05, 0);

    scene.add(new T.HemisphereLight(0xdde6ff, 0x2a2a32, 0.85));
    var key = new T.DirectionalLight(0xfff5ea, 1.05);
    key.position.set(2.5, 5, 3.2);
    scene.add(key);
    var fill = new T.DirectionalLight(0x9bb4d0, 0.4);
    fill.position.set(-3.2, 2.2, 1);
    scene.add(fill);
    var rim = new T.DirectionalLight(0x2de2c4, 0.22);
    rim.position.set(0.5, 2.5, -3);
    scene.add(rim);

    var rig;
    try { rig = HawaPlayerPreview.make({ style: 'suit', proportions: 'man' }); }
    catch (e) { console.warn('player preview', e); return; }
    var root = rig.root;
    root.position.set(0, 0, 0);
    root.rotation.y = 0;
    scene.add(root);

    var shadow = new T.Mesh(
      new T.CircleGeometry(0.42, 24),
      new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32, depthWrite: false })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.02;
    scene.add(shadow);

    var tie = rig.tie || null;
    var lids = rig.lids || [];
    var blinkT = 0, blinkWait = 1.8 + Math.random() * 2;
    /* كرافتة: يمين/يسار فقط — بدون دخول للجسم */
    var tieRz = 0, tieVz = 0;
    if (tie) {
      tie.rotation.x = 0.02; /* ثابت للأمام قليلاً عشان ما يختفش في القميص */
      /* قص للأبناء عشان ما يعدّوش الخلف */
      try {
        tie.traverse(function (o) {
          if (o.isMesh) {
            o.renderOrder = 2;
            if (o.material) {
              o.material = o.material.clone();
              o.material.depthWrite = true;
              o.material.polygonOffset = true;
              o.material.polygonOffsetFactor = -2;
              o.material.polygonOffsetUnits = -2;
            }
          }
        });
      } catch (_) {}
    }

    /* مواد البدلة (جاكيت/بنطلون) لتغيير اللون */
    var suitMats = [];
    var jacketHex = 0x34415e, pantsHex = 0x34415e;
    root.traverse(function (o) {
      if (!o.isMesh || !o.material || !o.material.color) return;
      var h = o.material.color.getHex();
      /* قرّب من لون البدلة الكحلي — استبعد الجلد/الشعر/القميص الأبيض/الربطة */
      var dr = ((h >> 16) & 255), dg = ((h >> 8) & 255), db = (h & 255);
      var isSkin = dr > 180 && dg > 140 && db > 100;
      var isHair = dr < 80 && dg < 60 && db < 50 && (dr + dg + db) < 160;
      var isWhite = dr > 220 && dg > 220 && db > 220;
      var isRed = dr > 140 && dg < 90 && db < 90;
      var isDarkBlue = db > dr && db > dg && dr < 100 && db > 60;
      var isNavy = Math.abs(dr - 0x34) < 40 && Math.abs(dg - 0x41) < 45 && Math.abs(db - 0x5e) < 50;
      if ((isDarkBlue || isNavy) && !isSkin && !isHair && !isWhite && !isRed) {
        o.material = o.material.clone();
        suitMats.push(o.material);
      }
    });

    var palette = [
      0x34415e, // كحلي أصلي
      0x1f2a44, // كحلي غامق
      0x2c3e50, // رمادي مزرق
      0x3d2b1f, // بني أنيق
      0x1a1a1a, // أسود
      0x2e4a3e, // أخضر داكن
      0x3b2d4f, // بنفسجي داكن
      0x4a3728  // قهوة
    ];
    var colFrom = new T.Color(palette[0]);
    var colTo = new T.Color(palette[1]);
    var colCur = new T.Color(palette[0]);
    var colT = 0, colIdx = 0;

    function fit() {
      var w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    fit();
    addEventListener('resize', fit);

    /* أنماط كاميرا: تبعد / تطلع / تقرب */
    function camPattern(t) {
      var cycle = 28; // ثوانٍ لدورة كاملة
      var u = (t % cycle) / cycle;
      var z0 = 5.2, y0 = 1.35;
      var z, y, lookY;
      if (u < 0.28) {
        /* تبعد ببطء */
        var p = u / 0.28;
        p = p * p * (3 - 2 * p);
        z = z0 + p * 2.4;
        y = y0 + p * 0.55;
        lookY = 1.05 + p * 0.15;
      } else if (u < 0.48) {
        /* تطلع فوق وتبعد أكثر */
        var p = (u - 0.28) / 0.2;
        p = p * p * (3 - 2 * p);
        z = z0 + 2.4 + p * 1.1;
        y = y0 + 0.55 + p * 0.85;
        lookY = 1.2 + p * 0.25;
      } else if (u < 0.72) {
        /* تقرب مع نزول */
        var p = (u - 0.48) / 0.24;
        p = p * p * (3 - 2 * p);
        z = z0 + 3.5 - p * 2.6;
        y = y0 + 1.4 - p * 1.15;
        lookY = 1.45 - p * 0.35;
      } else {
        /* إطار قريب هادئ ثم رجوع */
        var p = (u - 0.72) / 0.28;
        p = p * p * (3 - 2 * p);
        z = z0 + 0.9 - p * 0.9;
        y = y0 + 0.25 - p * 0.25;
        lookY = 1.1 - p * 0.05;
      }
      if (innerWidth < 700) { z += 0.7; y += 0.08; }
      return { z: z, y: y, lookY: lookY };
    }

    var t0 = performance.now(), last = t0;
    function tick(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      var t = (now - t0) / 1000;

      if (!reduced) {
        root.position.x = 0;
        root.rotation.y = Math.sin(t * 0.12) * 0.03;

        /* كرافتة: يمين وشمال بوضوح — بدون اختراق للخلف */
        if (tie) {
          var wind = Math.sin(t * 1.6) * 0.7 + Math.sin(t * 3.4) * 0.35 + Math.sin(t * 0.55) * 0.2;
          var targetZ = wind * 0.42; /* محور Z = يمين/يسار للكرافتة المعلّقة */
          var k = 22, d = 5.5;
          tieVz += (targetZ - tieRz) * k * dt - tieVz * d * dt;
          tieRz += tieVz * dt;
          /* حدود عشان ما تدخلش في الجاكيت */
          if (tieRz > 0.48) { tieRz = 0.48; tieVz *= 0.2; }
          if (tieRz < -0.48) { tieRz = -0.48; tieVz *= 0.2; }
          tie.rotation.z = tieRz;
          tie.rotation.x = 0.04 + Math.abs(tieRz) * 0.04; /* تميل قدام شوية بدل الخلف */
          tie.rotation.y = tieRz * 0.15;
        }

        /* رمش */
        blinkWait -= dt;
        if (blinkWait <= 0 && blinkT <= 0) {
          blinkT = 0.13 + Math.random() * 0.05;
          blinkWait = (Math.random() < 0.2 ? 0.2 : (2.2 + Math.random() * 3.5));
        }
        if (blinkT > 0) blinkT -= dt;
        var bl = blinkT > 0 ? Math.sin((1 - Math.max(0, blinkT) / 0.15) * Math.PI) : 0;
        for (var i = 0; i < lids.length; i++) lids[i].scale.y = 0.0001 + bl * 0.95;

        try { if (rig.chest) rig.chest.scale.y = 1 + Math.sin(t * 1.35) * 0.01; } catch (_) {}

        /* كاميرا سينمائية */
        var cp = camPattern(t);
        camera.position.x = Math.sin(t * 0.08) * 0.15;
        camera.position.y += (cp.y - camera.position.y) * Math.min(1, dt * 1.2);
        camera.position.z += (cp.z - camera.position.z) * Math.min(1, dt * 1.2);
        camera.lookAt(0, cp.lookY, 0);

        /* لون البدلة كل 10 ثوانٍ — تدرّج احترافي */
        colT += dt;
        var fade = Math.min(1, colT / 10);
        /* easing ناعم */
        var e = fade * fade * (3 - 2 * fade);
        colCur.copy(colFrom).lerp(colTo, e);
        for (var j = 0; j < suitMats.length; j++) {
          suitMats[j].color.copy(colCur);
        }
        if (colT >= 10) {
          colT = 0;
          colFrom.copy(colTo);
          colIdx = (colIdx + 1) % palette.length;
          colTo.setHex(palette[colIdx]);
        }
      } else {
        camera.position.set(0, 1.35, 5.2);
        camera.lookAt(0, 1.05, 0);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  /* ميلان ثلاثي الأبعاد + توهّج المؤشر */
  var cards=[].slice.call(document.querySelectorAll('.card'));
  cards.forEach(function(c){
    c.addEventListener('pointermove',function(e){
      if(e.pointerType==='touch')return;
      var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      c.style.setProperty('--mx',(x*100)+'%');c.style.setProperty('--my',(y*100)+'%');
      c.style.transform='rotateY('+((x-.5)*-10)+'deg) rotateX('+((y-.5)*8)+'deg) translateY(-6px)'});
    c.addEventListener('pointerleave',function(){c.style.transform='';c.style.setProperty('--mx','50%');c.style.setProperty('--my','50%')});
    c.addEventListener('click',function(e){
      e.preventDefault();var href=c.getAttribute('href'),kind=c.classList.contains('build')?'build':'play';
      if(window.HawaFX&&!HawaFX.busy)HawaFX.navigate(kind,href);else if(!window.HawaFX)location.href=href});
  });
  addEventListener('keydown',function(e){
    if(e.key==='1')cards[0].click();
    else if(e.key==='2')cards[1].click();
    else if(e.key==='Enter'&&document.activeElement&&document.activeElement.classList.contains('card'))document.activeElement.click();
  });
  addEventListener('pageshow',function(){document.getElementById('flash').classList.remove('on')});
})();
</script>

<script>
/* بوابتان: تنغلقان من نص الشاشة ← يظهر HAWA ENGINE ← تنفتحان على الرئيسية */
(function () {
  var g = document.getElementById('gate');
  var page = document.getElementById('mainPage'), modes = document.getElementById('modeCards');
  if (!g) return;
  var done = false, opened = false, timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function reveal(fast) {
    if (page) { page.classList.remove('boot-hide'); page.classList.add('boot-show'); }
    if (modes) setTimeout(function () { modes.classList.add('reveal'); }, fast ? 0 : 380);
  }
  function end() {
    if (done) return; done = true;
    timers.forEach(clearTimeout);
    g.classList.add('done');
  }
  function openNow() {
    if (opened) return; opened = true;
    timers.forEach(clearTimeout); timers = [];
    g.classList.add('close', 'logo', 'charge', 'open');
    reveal();
    at(1300, end);
  }

  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
  var skip = matchMedia('(prefers-reduced-motion: reduce)').matches || nav.type === 'back_forward';
  if (skip) { reveal(true); end(); }
  else {
    void g.offsetWidth;                                   /* تثبيت الحالة الأولية */
    requestAnimationFrame(function () { g.classList.add('close'); });  /* 0ms: البوابتان تتقابلان */
    at(900,  function () { g.classList.add('impact'); });  /* التقاء + وميض */
    at(1000, function () { g.classList.add('logo'); });    /* ظهور HAWA ENGINE */
    at(3000, function () { g.classList.add('charge'); });  /* توهج قبل الفتح */
    at(3350, openNow);                                     /* الانفتاح + الرئيسية */
    g.addEventListener('click', openNow);
    addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') openNow();
    }, { once: true });
  }
  addEventListener('pageshow', function (e) { if (e.persisted) { reveal(true); end(); } });
})();
</script>
